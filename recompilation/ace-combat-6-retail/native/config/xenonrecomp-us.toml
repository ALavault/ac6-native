# Direct XenonRecomp configuration for qualified NTSC-U/J analysis.
# This file is a build-time input only. Generated C++ belongs under the ignored
# build/ntsc-uj/native/codegen directory and is never shipped.

[main]
file_path = "assets/default.xex"
out_directory_path = "generated"
switch_table_file_path = "switch_tables.toml"

skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

longjmp_address = 0x823CA690
setjmp_address = 0x823CA9B0

# Helpers qualified from the US basefile byte signatures. Keep these starts
# explicit: XenonRecomp otherwise treats their save/restore islands as open.
restgprlr_14_address = 0x82382A30
savegprlr_14_address = 0x823829E0
restfpr_14_address = 0x82383F7C
savefpr_14_address = 0x82383F30
restvmx_14_address = 0x823853E8
savevmx_14_address = 0x82385150
restvmx_64_address = 0x8238547C
savevmx_64_address = 0x823851E4

# Calls through these guest dispatch sites require runtime binding later.
indirect_calls = [0x8237C368, 0x8237BA48]

# Switch-owner boundaries derived from the qualified US oracle's ordered case
# tuples.  They are the 70 non-overlapping leaf wrappers (not a copy of the
# oracle's generated source).
