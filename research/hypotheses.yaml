  - id: H-STATIC-UNIT-RECORD-CLASS-AND-FACTION-BYTES-DRIVE-CONSTRUCTION
    status: qualified
    statement: A parsed unit record's class byte selects the class the unit factory allocates and its faction byte selects the side flags and the per-faction census slot.
    discriminator: Require the class byte to reach 0x820A7F48 as its switch selector, require the faction byte to index the table the loader sizes from root slot 5, and require every record in the payload to land inside both domains.
    positive_control: data+0x08 feeds the switch at 0x820A72E0 whose result is passed to vtable slot +0x10 = 0x820A7F48, itself a switch on category-1 allocating 0x100, 0x100 or 0x230 bytes or delegating to 0x820A8E08. data+0x0D indexes *(record+0x18)+4 with stride 8 and the byte +0x2C of the entry selects one of nine flag sets. The loader allocates context+0x58 as count*0x44 from the same slot-5 count byte and 0x820A7070 increments +0x24 of the indexed entry once per created unit. Measured on the payload - 230 records, class bytes 0/1/2/4 with counts 1/40/188/1, faction bytes 0/1/2 with counts 140/42/48, 4 faction entries, zero record outside either domain.
    evidence: reports/cycle-1096-obj-slot-inserts-into-unitmanager.md; manifests/mission01-retail/census.json; payload SHA-256 51c10abe543ec1b8210bf089704db640003662fcb91f3b8dbaa091ec45ac6d45.
    qualification: "Qualified for the two links only. The category is a class selector, not a formation size and not a count. The faction byte is an index into a mission-supplied table, not a side name: all four Mission 01 entries carry side byte 0. Nothing here names a model, and ObjBin data+0x56, the argument of the second factory 0x820A8138, is 0 for all 434 Obj records in this payload, so its 15-entry key table is exercised at one value only."
  - id: H-STATIC-SUBMISSION-SCRIPT-IS-THE-OBJECTIVE-FLOW
    status: qualified
    statement: The unnamed 0x28 list under a sub-mission is that sub-mission's script, and the mission manager sequences sub-missions by index with a per-sub-mission start timestamp and a counter comparison.
    discriminator: Require the sub-mission count to be the parsed count byte, require the step stride and index to appear in the runner, require the timestamp array to be the one the loader sizes from the same count, and require the condition to compare a table the loader sizes from another parsed count.
    positive_control: 0x8226E908 bounds context+0x10 by *(u8*)*(*(context+0x264)+0x0C), the slot-2 count, and resets context+0x14. 0x8226E158 indexes the step list at context+0x14 * 0x28 and switches on the step's first byte; tag 0 writes context+0x64 into context+0x2C[context+0x10], the array the loader allocates as count*4; 0x82267008 reads it back as an elapsed-time test. Tag 7 compares *(id*0x14 + context+0x5C) - the table sized from slot 1's u16 count of 339 - against a 16-bit threshold under three operators and jumps to a sub-mission index. Measured - 4 sub-missions, 6 steps, tags 0 x4 and 1 x2, no tag 7, reproducing cycle 1092's census from the consumer side.
    evidence: reports/cycle-1097-submission-objective-flow.md; manifests/mission01-retail/census.json; payload SHA-256 51c10abe543ec1b8210bf089704db640003662fcb91f3b8dbaa091ec45ac6d45.
    qualification: "Qualified for the sequencing, the timestamp and the condition form. What the 339 counters count is not followed here, tags 2, 3 and 9 are absent from Mission 01 and unmodelled, and the four floats and flag word of tag 0 are read but not interpreted. Mission 01 carries no tag-7 step, so its own progression is not counter-gated - which is why the native objectives manifest uses the Manual condition and completes nothing by itself."
  - id: H-N3-OBJ-SLOT-CONSUMER-INSERTS-INTO-UNITMANAGER-SUPERSEDED
    status: rejected
    statement: The pre-registered N3 pass is needed to show that each iteration of 0x820A7070 produces one insertion into a unit registry.
    discriminator: Ask whether a static read of the called function settles what the run was meant to observe.
