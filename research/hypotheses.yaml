    positive_control: 0x8226EBD0 loops exactly 0x20 times building triples {start, end, delta} where start = count*i >> 5 and end = count*(i+1) >> 5 from *(region+4), dispatches each through 0x821D4938 against the job object 0x8275A494, joins with 0x821D49D8, advances a frame cursor at region+0x33E4 wrapping at DAT_823F9C7C, and calls 0x82265F00 on region+0x1050. mission_manager_update reaches it only under context+0x260 == 8 and passes the frame delta in f1.
