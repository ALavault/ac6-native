  - id: H-STATIC-OBJ-SLOT-CONSUMER-IS-0x820A7070
    status: qualified
    statement: The parsed Obj and Unit slot at scenario record+0x04 is consumed by 0x820A7070, which iterates it using the parsed count and turns two of its byte fields into a classification, a counter increment and activation bits.
    discriminator: Require the loop bound to be the parsed count itself rather than a parallel structure, require the element stride to match the parser's record, and require every record in the payload to fall inside the domain the consumer's switch implements.
    positive_control: The loop bound is *(u8*)(*(u32*)slot), which is exactly the container data word and its count byte. The stride is 0x0C, the record size 0x8232CCA0 writes. The switch at 0x820A7070 implements only values 0 to 4 for data+0x08, and all 230 level-0 records fall inside it - 1, 40, 188, 0, 1 - with zero outside. data+0x0D takes only three values and is used as an index into an 8-byte-stride table. The loop ends by incrementing a per-kind counter at kind*0x44 + *(context+0x58) + 0x24 and setting activation bits at *(*(context+0x264)+0x18) + 0x60. Both are derived from the mission context; the first argument is an identifier from the level-indexed tables of 0x821B7300, not an object.
    evidence: reports/cycle-1094-obj-slot-consumer.md; reports/cycle-1093-scenario-record-runtime-address.md; payload SHA-256 51c10abe543ec1b8210bf089704db640003662fcb91f3b8dbaa091ec45ac6d45.
    qualification: "Qualified for the chain and the field domain only. The classified value is a category in 1..6 passed to a virtual call made on the mission context, not on the first argument; it is NOT a formation size, although 1, 4, 4, 4, 3 invites that reading. What the categories mean, what the 0x24 counter counts and what the 0x60 bits activate are all unknown. 0x820A7070 reaches neither the unit factory 0x820A7F48 nor 0x822707C8 nor 0x8226D1C8 within six calls, so it is not the unit creator. This is the owner-to-consumer chain G1 asked for; it is not a wave identity and not an objective condition."
  - id: H-N3-OBJ-SLOT-CONSUMER-INSERTS-INTO-UNITMANAGER
    status: proposed
    statement: Each iteration of 0x820A7070 over the parsed Obj and Unit slot produces one atomic insertion or activation observable in UnitManager or MissionManager.
    discriminator: One bounded read-only run. At entry to 0x820A7070 record r3 (the identifier from 0x821B7300), r4 (the parsed slot pointer) and r6 (the selector). Per iteration record the element index, the parsed bytes data+0x08 and data+0x0D, the resulting category, the counter address kind*0x44 + *(context+0x58) + 0x24 with its value before and after, and the flag word *(*(context+0x264)+0x18) + 0x60 before and after. Positive control - the counter must increase exactly once per iteration and the total must equal the parsed count. Negative control - a UnitManager census taken before and after the three calls must differ by the number of iterations, or the hypothesis is rejected.
    qualification: "Pre-registered under the goal's N3 policy, authorised by the user. Expected artefact - one JSONL trace joined to the 230 static records by element index, plus a before/after UnitManager census. Time limit - one route, 300 s bound, three attempts maximum. Out of scope - menu traversal, input experiments, any hypothesis not listed here. This is the only runtime question the static work could not answer: cycles 1093 and 1094 established the owner, the loop bound, the field domain and the write sites, but not whether the writes constitute insertion into a unit registry."
