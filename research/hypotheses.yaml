  - id: H-STATIC-ORDERFLAGBIN-WRITES-THE-MISSION-COUNTERS
    status: qualified
    statement: The mission counter table at context+0x5C is written by exactly one function, and the scenario reaches it only through OrderFlagBin, tag 6 of the per-unit order program.
    discriminator: Find every site that scales an index by the table's 0x14 stride and also loads 0x5C, require the writer's operation table to be read off its jump table rather than inferred, require the caller's word indices to match the tag-to-word table OrderBin::read writes, and require every counter id the payload names to fall inside the table the loader sizes from root slot 1.
    positive_control: 54 functions scale by 20 and 16 also load 0x5C. 0x82267468 is the only writer; its jump table at 0x822674C4 gives four operations - set literal, add literal, 1 + random % literal, and the sum of two counters with 0xFFFF meaning absent - and after every branch it stamps counter+0x04 with the mission clock the first time the value is exactly 1, guarded against the FLT_MAX sentinel at 0x82008120. Its scenario caller is case 6 of the order dispatcher 0x822969F8, which dereferences puVar9[3], [4], [6] and [7] for tags 2, 3, 5 and 6 - the tag-to-word table of OrderBin::read. Mission 01 carries 232 tag-6 orders naming 133 distinct counters in 45..332, all below 339, with operations 0 and 1 only. Independently, 0x82269188 reads eight counters by immediate displacement and all eight are exact multiples of 20.
    evidence: reports/cycle-1101-mission-counter-writers.md; reconstruction/ace-combat-6/tests/retail_mission_state_tests.cpp; payload SHA-256 51c10abe543ec1b8210bf089704db640003662fcb91f3b8dbaa091ec45ac6d45.
    qualification: "Qualified for the mechanism and the domain. What an individual counter means is not established - only who writes it, with what value, and from which unit's order program. The entry's +0x08 bit word and its trailing eight bytes are uncharacterised, and whoever initialises the array to FLT_MAX was not found: the loader's allocation does not. The loop OrderFlag writes then a tag-7 condition reads is complete as a mechanism but is NOT exercised by Mission 01, which has no tag-7 step; its counters are read by other comparators."
  - id: H-STATIC-SCENARIO-WALK-IS-STRUCTURALLY-LOSSLESS
    status: qualified
    statement: The schema-driven walk sees every structural word of the Mission 01 scenario payload, and every byte it does not claim is a zero.
    discriminator: Re-emit the file from the parsed model with every node offset, table count and child offset recomputed rather than copied, and require the same SHA-256; then require that no unclaimed byte is non-zero.
    positive_control: 3477248 bytes reproduced identically from 62031 nodes, 28218 tables and 57811 data blocks, with 857240 bytes of structure recomputed. 694472 bytes are unclaimed and all of them are zero, in 88745 runs whose longest is 12 bytes - inter-block alignment padding. Tampering with the model rather than the bytes moves the output, so the structure is demonstrably recomputed and not copied.
    evidence: reports/cycle-1102-plan-closure.md; tools/roundtrip_ac6_scenario.py; tools/tests/test_ac6_static_tooling.py; payload SHA-256 51c10abe543ec1b8210bf089704db640003662fcb91f3b8dbaa091ec45ac6d45.
    qualification: "Qualified for structure only, and deliberately so: data blocks are copied verbatim because no schema claims to model their contents, which is exactly why the round trip cannot be wrong about them. It says the walk misses no table and no subtree; it says nothing about meaning."
