  - id: H-STATIC-CAMPAIGN-SCENARIO-INVARIANTS
    status: qualified
    statement: Every campaign scenario carries exactly one class-0 and one class-4 unit record, never uses class 3, always leaves root slot 4 empty, and never names a counter the slot-1 table cannot hold.
    discriminator: Sweep all fifteen levels the level table names, requiring the round trip, the ten-slot root, the class and faction domains and the counter bound to hold on every one - and report the headroom of the counter bound rather than only whether it held.
    positive_control: 15 of 15 round-trip identically with zero unclaimed non-zero bytes. 2953 unit records, 6784 Obj sub-records, 3650 OrderFlag orders, 9767 reader runs, no failure. Class 0 appears exactly once and class 4 exactly once in each of the fifteen; class 3 never appears; slot 4 is empty in all fifteen. The counter headroom is 1, 1, 3, 6, 7, 7, 32, 35, 66, 104, 108, 109, 123, 135 and 196 - tight to a single slot in two missions, so a wrong stride or a misread count word would break it somewhere.
    evidence: reports/cycle-1104-campaign-sweep.md.
    qualification: "Qualified for the campaign the level table names, entries 9 to 23. Entry 51 at index 0 has an empty child 0 and is not explained. Slot 6 is present in 13 of 15 and slot 8 in only 5, so the cycle-1083 phrase pairing slots 4 and 6 as empty is corrected: only slot 4 is campaign-wide empty. No p-code micro-execution was run outside Mission 01, so elsewhere the reader ran without failing, which is weaker than byte-for-byte agreement. The two unmodelled descents never fire in the solo campaign; multiplayer and off-table entries are outside this sweep."
  - id: H-STATIC-SCENARIO-SLOT6-IS-THE-AREA-RECORD-LIST
    status: qualified
    statement: Root slot 6 holds area records keyed by a kind byte, and the kind the game mode selects becomes the mission's axis-aligned area rectangle.
    discriminator: Read the root reader's slot dispatch rather than guessing, follow the loader's own call on the slot record, and require the four floats it ends up passing to be normalised into a min/max pair per axis - then require the data to agree across the campaign.
    positive_control: 0x82249718 dispatches slot 6 to reader 0x82309020, whose record keeps the last element of each kind byte at block +0xA6. The loader calls FUN_82266EF0 at 0x8219BF74, which caches those three at context+0x270, +0x274 and +0x278. 0x8226A018 selects +0x274 when 0x82267BF0 reports mode 4, 6, 7, 9 or 0x0E and +0x270 otherwise, skips a kind-2 block explicitly, and passes block +0x28, +0x30, +0x34 and +0x3C to FUN_82268B28, which writes min and max per pair into context+0x28C to +0x298. Across the campaign, kinds 0 and 1 always carry the full -50000..50000 world box, 22 identical occurrences, and kind 2 always carries a smaller mission-specific rectangle, 6 occurrences all different.
    evidence: reports/cycle-1105-slot6-area-records.md.
    qualification: "Qualified for the chain and the rectangle. What reads context+0x278 - the only mission-specific rectangle - is not established, and neither is which world axes the two coordinate pairs are; checking them against the tag-2 order coordinates is the obvious next step and was not done. The class cannot be named: 0x82309020 carries no error string. 0x821AC368 also writes context+0x270/0x274/0x278, from unrelated globals and with no direct caller, so it most likely serves another context class - that is not settled and is recorded as an ambiguity, not resolved."
