name: Apply audited AC6 fixes

on:
  push:
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/ac6-audit-fixes.patch.gz.b64 | gzip --decompress > /tmp/ac6-audit-fixes.patch
          echo '0cd2ef8c13aa8774a8b0475e7cefcaffdb2e720f01e558acd677fbd66861fe87  /tmp/ac6-audit-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/ac6-audit-fixes.patch
          git apply /tmp/ac6-audit-fixes.patch
          rm .github/ac6-audit-fixes.patch.gz.b64
          git diff --check

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AC6 audit automation'
          git config user.email '29574992+ALavault@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden native runtime and audit gates'
          git push origin HEAD:main
